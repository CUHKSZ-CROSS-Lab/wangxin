name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://cuhksz-cross-lab.github.io/wangxin/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the portfolio for /wangxin/
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /wangxin
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
